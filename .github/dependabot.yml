version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jerusalem
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      routine-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      routine-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Jerusalem
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      routine-actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jerusalem
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
